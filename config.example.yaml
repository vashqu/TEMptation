# TEMptation config file — STRUCTURE REFERENCE, NOT YET WIRED UP.
#
# temptation.config.load_config() can parse a file shaped like this into an
# AnalysisConfig, but no --config flag exists on the CLI (measure_nerve.py)
# and the GUI has no "load config file" action either. Every value below
# must currently be set via CLI flags or GUI fields instead — see README.md
# and how_to_use.txt for the full flag list, or docs/qc.md for what each QC
# threshold means.
#
# This file exists so the shape of AnalysisConfig is documented somewhere,
# and so a future --config flag has a known-correct example to test against.
# Loading YAML also requires `pip install pyyaml` (not a hard dependency of
# this package) — a .json file with the same structure works without it.

pixel_size_um: 0.00524          # µm/px. See README "Computing pixel size".
group: null                     # explicit group label; usually set per-folder via --groups instead

segmentation:
  myelin_val: 64
  axoplasm_val: 192
  mito_val: 128

  mode: auto                    # auto | normal | pathological -- see docs/known_issues.md F3
  myelin_threshold_px: 200

  smoothing_radius_px: 1
  min_axon_area_px: 200
  min_myelin_area_px: 300

  watershed_mode: weighted      # simple | weighted
  watershed_weight: radius      # radius | area
  watershed_compactness: 0.001
  watershed_beta: 1.0

  assign_detached_myelin: none  # none | nearest

  mito_hole_handling: fill      # fill (default, correct) | legacy (bug-for-bug, see docs/known_issues.md F1)
  mito_assignment: centroid     # centroid (default) | overlap | legacy (see docs/known_issues.md F8)

# qc_thresholds: null (None) means "not calibrated for this dataset" -- the
# corresponding flag stays all-False, it does NOT default to 0. See docs/qc.md.
qc_thresholds:
  g_ratio_min: 0.3
  g_ratio_max: 0.95
  axon_circularity_min: 0.4
  min_myelin_area_um2: null
  min_axon_area_um2: null
  min_fiber_area_um2: null
  min_mito_count_for_clustering: 3

# Not yet implemented -- see docs/pathology_score.md. Included here only so
# the AnalysisConfig shape is complete; `enabled: true` does nothing today.
pathology_score:
  enabled: false
  version: v0
  components: {}
